<!DOCTYPE html>
<html>
<head>
    <title>Test Error Handling</title>
</head>
<body>
    <h1>Testing Connection Error Handling</h1>
    <div id="output"></div>
    
    <script>
        var output = document.getElementById('output');
        
        function log(message) {
            var p = document.createElement('p');
            p.textContent = new Date().toISOString() + ': ' + message;
            output.appendChild(p);
            console.log(message);
        }
        
        // Test 1: Fetch with server down
        log('Testing fetch with server potentially down...');
        fetch('/api/presets')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                log('✓ Successfully fetched data: ' + data.length + ' presets');
            })
            .catch(err => {
                log('✗ Failed to fetch: ' + err.message);
                log('Will retry in 2 seconds...');
                setTimeout(() => location.reload(), 2000);
            });
        
        // Test 2: WebSocket connection
        log('Testing WebSocket connection...');
        var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        var wsUrl = `${protocol}//${window.location.host}/ws`;
        
        try {
            var ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                log('✓ WebSocket connected');
            };
            
            ws.onerror = function(error) {
                log('✗ WebSocket error: ' + error);
            };
            
            ws.onclose = function(event) {
                log('✗ WebSocket closed (code: ' + event.code + ')');
                log('Will reconnect in 2 seconds...');
            };
        } catch (err) {
            log('✗ Failed to create WebSocket: ' + err.message);
        }
    </script>
</body>
</html>
